<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ResNav AI — disaster relief resource intelligence: semantic search, depletion forecasting, zone risk prediction and allocation planning." />
    <meta name="theme-color" content="#0F0F0F" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F5F2EB" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>ResNav AI — Resource Intelligence</title>
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('resnav-theme');
          var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>ResNav requires JavaScript to display live resource intelligence.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
