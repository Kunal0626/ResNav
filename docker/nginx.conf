# Serves the built SPA and proxies the API, so the browser talks to one
# origin and CORS never enters the picture -- the same arrangement the Vite
# dev server provides in development.
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # A single-page app: any unknown path is a client route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # The AI endpoints fit scikit-learn models on request; the default
        # 60s read timeout is tight for the simulation one.
        proxy_read_timeout 120s;
    }

    # Hashed asset filenames are safe to cache forever; index.html is not.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    add_header X-Content-Type-Options nosniff            always;
    add_header X-Frame-Options         SAMEORIGIN        always;
    add_header Referrer-Policy         strict-origin-when-cross-origin always;
}
