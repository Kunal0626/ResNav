# The whole stack: MySQL, the Flask API, and the built SPA behind nginx.
#
#     cp .env.example .env     # then set DRA_MYSQL_PASSWORD
#     docker compose up --build
#     open http://localhost:8080
#
# The no-Docker path is `make install && make reset && make api` against a
# local MySQL, and is the one this project is developed against. Both are
# documented in the README.

name: resnav

services:
  db:
    image: mysql:8.4
    # 8.4 rather than latest: this project targets 8.0.16+ syntax, and
    # pinning a major means a `docker compose pull` cannot change the
    # database engine under a schema that was tested against it.
    command:
      - --log-bin-trust-function-creators=ON
      # Required so a non-SUPER account can create the triggers and stored
      # functions this schema is built from. See docs/AUDIT.md; the probe in
      # tools/capabilities.sql reports it.
    environment:
      # Both containers run UTC, so the database and the API agree about what
      # a naive timestamp means. The API attaches the offset on the way out.
      TZ: UTC
      MYSQL_ROOT_PASSWORD: ${DRA_MYSQL_ROOT_PASSWORD:-rootpw}
      MYSQL_DATABASE: ${DRA_MYSQL_DB:-resnav}
      MYSQL_USER: ${DRA_MYSQL_USER:-resnav_app}
      MYSQL_PASSWORD: ${DRA_MYSQL_PASSWORD:?set DRA_MYSQL_PASSWORD in .env}
    volumes:
      - resnav-db:/var/lib/mysql
      # The schema, routines and seed, applied once by the image's own
      # entrypoint the first time the volume is empty. Read-only: a
      # container should never be able to edit the repository.
      - ./db:/sql:ro
      - ./docker/mysql-init.sh:/docker-entrypoint-initdb.d/10-resnav.sh:ro
    healthcheck:
      # mysqladmin ping answers before the init scripts have finished, so it
      # would let the API start against an empty schema. Checking for a table
      # the seed creates is what actually means "ready".
      test: ["CMD-SHELL", "mysql -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT COUNT(*) FROM Providers' \"$$MYSQL_DATABASE\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      TZ: UTC
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      # The browser talks to nginx on 8080, which proxies /api, so requests
      # are same-origin and this is only a fallback for direct access.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DRA_MYSQL_HOST: db
      DRA_MYSQL_PORT: 3306
      DRA_MYSQL_DB: ${DRA_MYSQL_DB:-resnav}
      DRA_MYSQL_USER: ${DRA_MYSQL_USER:-resnav_app}
      DRA_MYSQL_PASSWORD: ${DRA_MYSQL_PASSWORD:?set DRA_MYSQL_PASSWORD in .env}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      ENABLE_TRANSFORMERS: ${ENABLE_TRANSFORMERS:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Exposed for curl and the concurrency scripts; the SPA does not use it.
      # Bound to the loopback deliberately: on a public VM this must not be
      # a second, uncertificated way into the API. Caddy is the only door.
      - '127.0.0.1:8000:8000'
    restart: unless-stopped

  web:
    build:
      # Repository root, because the Dockerfile needs docker/nginx.conf too.
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Loopback for the same reason as the API above. Locally this is still
      # http://localhost:8080; in production Caddy reaches it over the
      # compose network, which does not involve this binding at all.
      - '127.0.0.1:8080:80'
    restart: unless-stopped

volumes:
  resnav-db:
