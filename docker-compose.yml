# ⚠ NOT YET UPDATED FOR MYSQL, AND NOT TESTED.
#
# This file was imported from ResNav AI, where the database was a SQLite file
# on a mounted volume. The merged app uses MySQL, so this stack is wrong: it
# has no database service and still sets DATABASE_PATH.
#
# Phase 8 rewrites it as mysql + api + web and tests it. Docker is not
# installed on the development machine, so nothing here has been run.
# Until then, use the local path:  ./run.sh install && ./run.sh reset
#
# Local production-parity stack: the API in a container, the frontend built and
# served as static files. For day-to-day development use `npm run dev` and
# `python manage.py run` instead — both give hot reload.

services:
  api:
    build: ./backend
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env or the environment}
      CORS_ORIGINS: http://localhost:8080
      DATABASE_PATH: /data/resource_navigator.db
      LOG_LEVEL: INFO
    volumes:
      - resnav-data:/data
    ports:
      - '8000:8000'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  web:
    image: nginx:alpine
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    ports:
      - '8080:80'
    restart: unless-stopped

volumes:
  resnav-data:
